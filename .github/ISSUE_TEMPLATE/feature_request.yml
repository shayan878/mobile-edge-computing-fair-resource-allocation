name: Feature request
description: Propose a research or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include relevant equations, assumptions, and units for mathematical changes.
    validations:
      required: true
